<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira de Investimento - Login</title>
  <link rel="stylesheet" href="styles/style.css">
  <script>
    // Aplica o tema escuro antes da pagina renderizar para evitar piscar
    if (localStorage.getItem('tema') === 'escuro') {
      document.documentElement.classList.add('tema-escuro');
    }
  </script>
  <script src="js/tema.js" defer></script>
  <script src="js/validacao.js" defer></script>
  <script src="js/login.js" defer></script>
</head>
<body class="auth-page">

  <button class="auth-toggle" type="button" id="btn-tema" aria-pressed="false">
    <span class="label-tema">Modo escuro</span>
  </button>

  <form class="auth-card" id="form-login" novalidate>
    <h1>Login</h1>
    <p>Acesse o sistema Carteira de Investimento para acompanhar aportes e visualizar sua carteira.</p>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite seu e-mail">
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha">
    </div>

    <div class="linha-lembrar">
      <input type="checkbox" id="lembrar">
      <label for="lembrar">Lembrar meu e-mail</label>
    </div>

    <button class="btn full" type="submit">Entrar</button>

    <div class="links">
      <a href="src/register.html">Criar conta</a>
      <a href="src/forgot-password.html">Esqueci a senha</a>
    </div>
  </form>

</body>
</html>
