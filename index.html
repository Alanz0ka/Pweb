<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira de Investimento - Login</title>
  <link rel="stylesheet" href="styles/style.css">
  <script>
    try {
      if (localStorage.getItem('investApp.theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <script src="js/app.js" defer></script>
</head>
<body class="auth-page">

  <button class="auth-toggle" type="button" data-theme-toggle aria-pressed="false">
    <span data-theme-label>Modo escuro</span>
  </button>

  <form class="auth-card" data-form-message="Login realizado com sucesso." data-form-next="src/home.html">
    <h1>Login</h1>
    <p>Acesse o sistema Carteira de Investimento para acompanhar aportes e visualizar sua carteira.</p>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite seu e-mail" required>
    </div>

    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>
    </div>

    <button class="btn full" type="submit">Entrar</button>

    <div class="links">
      <a href="src/register.html">Criar conta</a>
      <a href="src/forgot-password.html">Esqueci a senha</a>
    </div>
  </form>

</body>
</html>
