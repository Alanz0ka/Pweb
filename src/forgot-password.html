<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira de Investimento - Recuperar senha</title>
  <link rel="stylesheet" href="../styles/style.css">
  <script>
    if (localStorage.getItem('tema') === 'escuro') {
      document.documentElement.classList.add('tema-escuro');
    }
  </script>
  <script src="../js/tema.js" defer></script>
  <script src="../js/validacao.js" defer></script>
  <script src="../js/recuperar.js" defer></script>
</head>
<body class="auth-page">

  <button class="auth-toggle" type="button" id="btn-tema" aria-pressed="false">
    <span class="label-tema">Modo escuro</span>
  </button>

  <form class="auth-card" id="form-recuperar" novalidate>
    <h1>Recuperar senha</h1>
    <p>Digite seu e-mail para simular a recuperacao de acesso.</p>

    <div class="form-group">
      <label for="rec-email">E-mail</label>
      <input type="email" id="rec-email" placeholder="Digite seu e-mail">
    </div>

    <button class="btn full" type="submit">Enviar</button>

    <div class="links">
      <a href="../index.html">Voltar para login</a>
    </div>
  </form>

</body>
</html>
