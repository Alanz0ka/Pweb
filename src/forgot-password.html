<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira de Investimento - Recuperar senha</title>
  <link rel="stylesheet" href="../styles/style.css">
  <script>
    try {
      if (localStorage.getItem('investApp.theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <script src="../js/app.js" defer></script>
</head>
<body class="auth-page">

  <button class="auth-toggle" type="button" data-theme-toggle aria-pressed="false">
    <span data-theme-label>Modo escuro</span>
  </button>

  <form class="auth-card" data-form-message="Enviamos um e-mail com as instrucoes de recuperacao." data-form-next="../index.html">
    <h1>Recuperar senha</h1>
    <p>Digite seu e-mail para simular a recuperacao de acesso.</p>

    <div class="form-group">
      <label for="rec-email">E-mail</label>
      <input type="email" id="rec-email" placeholder="Digite seu e-mail" required>
    </div>

    <button class="btn full" type="submit">Enviar</button>

    <div class="links">
      <a href="../index.html">Voltar para login</a>
    </div>
  </form>

</body>
</html>
