<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carteira de Investimento - Cadastro</title>
  <link rel="stylesheet" href="../styles/style.css">
  <script>
    try {
      if (localStorage.getItem('investApp.theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <script src="../js/app.js" defer></script>
</head>
<body class="auth-page">

  <button class="auth-toggle" type="button" data-theme-toggle aria-pressed="false">
    <span data-theme-label>Modo escuro</span>
  </button>

  <form class="auth-card" data-form-message="Cadastro realizado com sucesso." data-form-next="home.html">
    <h1>Cadastro</h1>
    <p>Preencha os dados abaixo para criar acesso ao sistema Carteira de Investimento.</p>

    <div class="form-group">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome" required>
    </div>

    <div class="form-group">
      <label for="cad-email">E-mail</label>
      <input type="email" id="cad-email" placeholder="Digite seu e-mail" required>
    </div>

    <div class="form-group">
      <label for="cad-senha">Senha</label>
      <input type="password" id="cad-senha" placeholder="Digite sua senha" required>
    </div>

    <div class="form-group">
      <label for="confirmar">Confirmar senha</label>
      <input type="password" id="confirmar" placeholder="Confirme sua senha" required>
    </div>

    <button class="btn full" type="submit">Cadastrar</button>

    <div class="links">
      <a href="../index.html">Voltar para login</a>
    </div>
  </form>

</body>
</html>
